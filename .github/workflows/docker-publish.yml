name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Custom image tag (e.g., latest, stable)"
        required: false
        default: ""
        type: string

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vibe-kanban-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Determine image tags
        id: tags
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          CUSTOM_TAG: ${{ inputs.image-tag }}
        run: |
          TAGS="$META_TAGS"

          # Add custom tag if provided
          if [ -n "$CUSTOM_TAG" ]; then
            TAGS="$TAGS"$'\n'"${REGISTRY}/${IMAGE_NAME}:${CUSTOM_TAG}"
          fi

          # TAGS holds one tag per line, so it needs the multiline output syntax
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "full-image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push with Docker Buildx
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Output image info
        env:
          FULL_IMAGE: ${{ steps.tags.outputs.full-image }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "Image published successfully!"
          echo "Image: $FULL_IMAGE"
          echo "Tags: $TAGS"
          
      - name: Create deployment notification
        if: github.event_name == 'release'
        run: |
          echo "::notice title=Docker Image Published::Image: ${{ steps.tags.outputs.full-image }}:${{ github.event.release.tag_name }}"
